name: CONXUS Communications
description: >-
  CONXUS Communications, Inc. was a United States advanced-messaging and
  narrowband-PCS carrier, headquartered in Greenville, South Carolina, that
  operated the Pocketalk voice-messaging and Pocketext text-messaging services
  built on Motorola's InFLEXion protocol. Formed in the mid-1990s from a group of
  one-way paging providers and backed by strategic and financial investors, the
  company offered wireless voice messaging, guaranteed message delivery,
  automatic acknowledgment of receipt, error correction, longer messages, and
  subscriber-originated replies across roughly ten U.S. markets. Conxus filed for
  bankruptcy protection in May 1999 and ceased network operations on August 27,
  1999, affecting an estimated 80,000-100,000 subscribers. The company is defunct
  and publishes no API, developer portal, or SDK; this profile is retained as a
  historical portfolio record only.
